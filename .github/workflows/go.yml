name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Generate
      if: runner.os == 'Linux'
      run: |
        # delete the generated files and re-generate to make sure that
        # the contents are reproducible
        rm -rf internal/server/static/generated
        go generate -v ./...
        git diff --exit-code

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

    - name: Test (with -race)
      if: runner.os == 'Linux'
      run: go test -v -race ./...
